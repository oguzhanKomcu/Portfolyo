<!DOCTYPE html>
<html lang="tr">

<head>
    <!-- Eski blog linkleri (blog-post.html?slug=...) için yönlendirme. Yeni adres: blog/<slug>.html -->
    <meta charset="UTF-8">
    <meta name="robots" content="noindex">
    <title>Yönlendiriliyor... | Oğuzhan Kömcü</title>
    <script>
        const slug = new URLSearchParams(location.search).get('slug');
        location.replace(slug && /^[a-z0-9-]+$/.test(slug) ? `blog/${slug}.html` : 'blog.html');
    </script>
</head>

<body style="background:#050505;color:#e0e6ed;font-family:monospace;text-align:center;padding-top:20vh">
    <p>Yönlendiriliyor... <a href="blog.html" style="color:#00f3ff">Blog</a></p>
</body>

</html>
